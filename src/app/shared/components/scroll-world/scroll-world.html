<div class="escena">
  @if (!listo()) {
    <div class="esqueleto" aria-hidden="true"></div>
  }
  <canvas #lienzo aria-hidden="true"></canvas>
  <div class="texto" aria-live="polite">
    @for (e of escenas; track e.titulo; let i = $index) {
      <article [class.activa]="i === actual()">
        <small>{{ i + 1 }} / {{ escenas.length }}</small>
        <h2>{{ e.titulo }}</h2>
        <p>{{ e.texto }}</p>
      </article>
    }
  </div>
</div>
