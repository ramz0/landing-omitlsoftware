<div class="escena">
  @if (!listo()) {
    <div class="esqueleto" aria-hidden="true"></div>
  }
  <canvas #lienzo aria-hidden="true"></canvas>
  <div class="texto" aria-live="polite">
    @for (e of escenas; track e.titulo; let i = $index) {
      <article [class.activa]="i === actual()">
        <small>{{ i + 1 }} / {{ escenas.length }}</small>
        <h2>{{ e.titulo }}</h2>
        <p>{{ e.texto }}</p>
      </article>
    }
  </div>
  <div class="cierre" [class.visible]="actual() === -1">
    <h2>¿Qué proceso vive hoy en hojas de cálculo?</h2>
    <p>Cuéntanos y te proponemos cómo llevarlo a un sistema hecho a tu medida.</p>
    <a href="#contacto">Hablemos</a>
  </div>
</div>
