<div class="case">
  <div class="escena"></div>
  <!-- Texto accesible (y en pantallas angostas, visible): la escena 3D lo proyecta sobre la mesa. -->
  <p class="info" aria-live="polite">
    @if (activa(); as t) {
      <b>{{ t.nombre }}</b> {{ t.uso }}
    } @else {
      Presiona una tecla para ver cómo usamos cada tecnología.
    }
  </p>
  <ul class="botones">
    @for (t of tecnologias(); track t.nombre) {
      <li>
        <button type="button" [attr.aria-pressed]="activa() === t" (click)="seleccionar(t)">{{ t.nombre }}</button>
      </li>
    }
  </ul>
</div>
