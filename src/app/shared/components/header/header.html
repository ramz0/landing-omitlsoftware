<header [class.compacto]="compacto()">
  <nav class="wrap" aria-label="Principal">
    <img src="logo.svg" alt="omitl software" />
    <div class="acciones">
      <div class="enlaces" [class.abierto]="abierto()" (click)="abierto.set(false)">
      <a class="enlace" routerLink="/" fragment="inicio"><app-icono nombre="casa" /> Inicio</a>
      <a class="enlace" routerLink="/aboutus"><app-icono nombre="edificio" /> Quiénes somos</a>
      <a class="enlace" routerLink="/calculator"><app-icono nombre="calculadora" /> Calculadora de presupuesto</a>
      </div>
      <button class="menu" type="button" aria-label="Menú" [attr.aria-expanded]="abierto()" (click)="abierto.set(!abierto())">{{ abierto() ? '✕' : '☰' }}</button>
      <app-boton href="/#contacto" icono="chat" [flota]="true">Hablemos</app-boton>
    </div>
  </nav>
</header>
