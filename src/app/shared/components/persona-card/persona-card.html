<article [class.con-foto]="persona().foto">
  @if (persona().foto) {
    <div class="foto" [style.background-image]="fondo()" role="img" [attr.aria-label]="persona().nombre"></div>
  } @else {
    <app-icono class="verificado" nombre="verificado" />
  }
  <div class="texto">
    <h3>{{ persona().nombre }}</h3>
    <p class="rol">{{ persona().rol }}</p>
    <p class="bio">{{ persona().descripcion }}</p>
    <app-redes-sociales [redes]="persona().redes" />
  </div>
</article>
